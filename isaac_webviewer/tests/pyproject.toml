# This GPU-free test project uses the scaffolded Python image, not the viewer
# node's image. HTTP and lifecycle tests need only the standard library and pytest.
[project]
name = "isaac-webviewer-tests"
version = "0.1.0"
description = "GPU-free tests for the Isaac viewer HTTP server and node lifecycle"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
