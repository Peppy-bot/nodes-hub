# The GPU-free suites are their own uv project rather than part of the node
# above them. The node manages nothing through uv: its python runs on the
# interpreter its image ships, against the dependencies baked into that image.
#
# CI runs a python test project inside the image built from the apptainer.def
# beside it, and gives a project with no def the scaffolded python base image.
# These suites use small USD fixtures and fake engine runtimes, without
# pulling the multi-gigabyte Isaac Sim image or requiring a GPU.
[project]
name = "sim-isaac-tests"
version = "0.1.0"
description = "GPU-free tests for the sim_isaac node: its model entries, pair routing, robot stays, stage, visuals, startup, loop pacing, cameras and clock"
# One minor, so every run resolves the same interpreter.
requires-python = ">=3.11,<3.12"
dependencies = [
    # What the engine's modules reach for: pyjson5 to read the model entries,
    # numpy to pack depth. The pyjson5 pin is the one the node's base image
    # installs (sim_base_images/requirements.isaac.txt), so the parser under
    # test is the parser the node runs on. That file leaves numpy to Isaac
    # Sim, which is free to move it, hence the floor here.
    "numpy>=1.26",
    "pyjson5==2.0.0",
    # What the engine shares with every other one: the registry, the four
    # slots, the model entries and the camera configuration.
    "sim_robot_core",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pycollada==0.9.3",
    # What scripts/build_so101.py compiles the SO-101's upstream MJCF with.
    "mujoco==3.10.0",
    # PyPI provides no USD wheel or source distribution for Linux ARM64.
    # That platform runs the runtime suites without the USD-specific tests.
    "usd-core==26.5; platform_machine == 'x86_64' or platform_machine == 'AMD64' or sys_platform == 'darwin'",
]

[tool.uv]
# The suites reach the node's modules through sys.path, so this project has
# nothing importable of its own and no wheel to build.
package = false

[tool.uv.sources]
sim_robot_core = { git = "https://github.com/Peppy-bot/peppy", subdirectory = "public-peppy-libs/sim_robot_core", rev = "9dde20f5b014dd7fd16487e6e0071b0c9c0fb0cc" }
