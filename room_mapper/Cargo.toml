[package]
name = "room_mapper"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Maps the rooms a mobile base drives in with its 2-D lidar, saves and loads the maps, and keeps the base localized in the loaded one"

[lints.rust]
unsafe_code = "deny"

[dependencies]
camera_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "camera_core" }
control_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "control_core" }
frame_tree = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "frame_tree" }
mapping_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "mapping_core" }
navigation_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "navigation_core" }
serde = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }

[dev-dependencies]
hegeltest = { version = "0.51", features = ["static-engine"] }
serde_json = "1"
peppygen = { path = ".peppy/libs/peppygen", features = ["testing"] }
tokio = { version = "1", features = ["test-util"] }

[profile.dev.package.mapping_core]
opt-level = 3

[profile.dev.package.faer]
opt-level = 3
