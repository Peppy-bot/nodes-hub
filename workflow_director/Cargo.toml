[package]
name = "workflow_director"
version = "0.1.0"
edition = "2024"

[dependencies]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
peppy-codec = { path = ".peppy/libs/peppy-codec" }
workflow_documents = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "workflow_documents" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
hegeltest = { version = "0.50", features = ["static-engine"] }
peppygen = { path = ".peppy/libs/peppygen", features = ["testing"] }
tempfile = "3"
