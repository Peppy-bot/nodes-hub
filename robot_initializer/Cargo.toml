[package]
name = "robot_initializer"
version = "0.1.0"
edition = "2024"

[dependencies]
control_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "control_core" }
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
futures  = "0.3"
tokio    = { version = "1", features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
peppygen = { path = ".peppy/libs/peppygen", features = ["testing"] }
tokio = { version = "1", features = ["test-util"] }
