[package]
name = "robot_initializer"
version = "0.1.0"
edition = "2024"

[dependencies]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
futures  = "0.3"
tokio    = { version = "1", features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
peppygen = { path = ".peppy/libs/peppygen", features = ["testing"] }
# Paused time, for the tests of the host's clock that the wait for standing
# runs on.
tokio = { version = "1", features = ["test-util"] }
