[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my_python_robot_brain"
version = "0.1.0"
description = "my_python_robot_brain peppy node"
requires-python = ">=3.11,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
my_python_robot_brain = "my_python_robot_brain.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/my_python_robot_brain"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }