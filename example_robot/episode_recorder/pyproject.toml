[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "episode_recorder"
version = "0.1.0"
description = "episode_recorder peppy node"
requires-python = ">=3.13,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
episode_recorder = "episode_recorder.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/episode_recorder"]

[dependency-groups]
dev = []

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
