# The suites are their own uv project rather than part of the node above
# them. The node manages nothing through uv: its python runs on the
# interpreter its image ships, against the dependencies baked into that image.
#
# CI runs a python test project inside the image built from the apptainer.def
# beside it, and gives a project with no def the scaffolded python base image.
# The def here is that base image with git, not the node's image: the suites
# render nothing, so a mujoco wheel and a compiled MJCF are the whole of what
# they need from the simulation.
[project]
name = "sim-mujoco-tests"
version = "0.1.0"
description = "Tests for the sim_mujoco node: its model entries, pair routing, robot stays, bridge and camera plumbing"
# The interpreter the node's base image is built on
# (sim_base_images/Dockerfile.mujoco: python:3.12-slim).
requires-python = ">=3.12,<3.13"
dependencies = [
    # The versions the node's base image installs
    # (sim_base_images/requirements.mujoco.txt), so the scene these
    # suites compile is compiled by the mujoco the node runs on.
    "mujoco==4.0.0",
    "numpy==2.5.4",
    "pyjson5==2.0.1",
    # What the engine shares with every other one: the registry, the four
    # slots, the model entries and the camera configuration.
    "sim_robot_core",
    # The robots' descriptions, which a robot's entry is built from and each
    # model of the release is held to (test_release_models.py).
    "robot_description_py",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# The suites reach the node's modules through sys.path, so this project has
# nothing importable of its own and no wheel to build.
package = false

[tool.uv.sources]
sim_robot_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", subdirectory = "sim_robot_core", rev = "1c80539a6b88f0f1566d3d7614f71ada8be9fcb1" }
robot_description_py = { git = "https://github.com/Peppy-bot/public-peppy-libs", subdirectory = "robot_description_py", rev = "1c80539a6b88f0f1566d3d7614f71ada8be9fcb1" }
