[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "so101_backbone"
version = "0.1.0"
description = "so101_backbone peppy node"
requires-python = ">=3.12,<3.14"
dependencies = [
    "peppygen",
    "peppylib",
    "control_core_py",
    "so101_description[kinematics]",
    "workspace_core_py",
]

[project.scripts]
so101_backbone = "so101_backbone.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_backbone"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
# The shared libs live in the public-peppy-libs repository, all three at one
# commit of it, so the backbone builds against one state of that repository.
# workspace_core_py is a PyO3 extension that uv builds from its source, so the
# build needs cargo (see apptainer.def).
control_core_py = { git = "https://github.com/Peppy-bot/public-peppy-libs", subdirectory = "control_core_py", rev = "997a29ffad6baf99e02966659ca91345fd1b07c0" }
so101_description = { git = "https://github.com/Peppy-bot/public-peppy-libs", subdirectory = "so101_description", rev = "997a29ffad6baf99e02966659ca91345fd1b07c0" }
workspace_core_py = { git = "https://github.com/Peppy-bot/public-peppy-libs", subdirectory = "workspace_core_py", rev = "997a29ffad6baf99e02966659ca91345fd1b07c0" }
