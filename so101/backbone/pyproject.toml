[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "so101_backbone"
version = "0.1.0"
description = "so101_backbone peppy node"
requires-python = ">=3.12,<3.14"
dependencies = [
    "peppygen",
    "peppylib",
    "control_core_py",
    "path_timing_py",
    "robot_description_py",
    "so101",
    "workspace_core_py",
    # A placo 0.x minor release can change its QP and its API: the solvers of
    # the kinematics module are checked on this minor.
    "placo>=0.11.0,<0.12",
]

[project.scripts]
so101_backbone = "so101_backbone.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_backbone"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
# The shared libs live in the public-peppy-libs repository, followed on its
# default branch like the Rust nodes' control_core.
# path_timing_py, robot_description_py and workspace_core_py are PyO3
# extensions that uv builds from their source, so the build needs cargo (see
# apptainer.def).
control_core_py = { git = "https://github.com/Peppy-bot/public-peppy-libs", subdirectory = "control_core_py" }
path_timing_py = { git = "https://github.com/Peppy-bot/public-peppy-libs", subdirectory = "path_timing_py" }
robot_description_py = { git = "https://github.com/Peppy-bot/public-peppy-libs", subdirectory = "robot_description_py" }
so101 = { git = "https://github.com/Peppy-bot/public-peppy-libs", subdirectory = "so101" }
workspace_core_py = { git = "https://github.com/Peppy-bot/public-peppy-libs", subdirectory = "workspace_core_py" }
