[package]
name = "motion_planner"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
camera_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "camera_core" }
chain_kinematics = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "chain_kinematics" }
collision_geometry = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "collision_geometry" }
control_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "control_core" }
motion_planning_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "motion_planning_core" }
occupancy_map = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "occupancy_map" }
ompl_bridge = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "ompl_bridge" }
openarm_description = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "openarm_description", features = ["meshes"] }
self_collision_model = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "self_collision_model" }

[dev-dependencies]
peppygen = { path = ".peppy/libs/peppygen", features = ["testing"] }
openarm_description = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "openarm_description", features = ["kinematics"] }

[profile.dev.package.self_collision_model]
opt-level = 3

[profile.dev.package.collision_geometry]
opt-level = 3

[profile.dev.package.chain_kinematics]
opt-level = 3

[profile.dev.package.occupancy_map]
opt-level = 3

[profile.dev.package.motion_planning_core]
opt-level = 3
