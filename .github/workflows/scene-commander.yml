name: Scene Commander

on:
  pull_request:
    paths:
      - openarm/scene_commander/**
      - .github/workflows/scene-commander.yml
  push:
    branches: [main]
    paths:
      - openarm/scene_commander/**
      - .github/workflows/scene-commander.yml

permissions:
  contents: read

jobs:
  catalogue-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Test catalogue selection and descriptions
        run: node --test openarm/scene_commander/tests/*.test.mjs
