name: Tests

# Runs every repository Rust, Python, JavaScript and TypeScript test on each
# pull request and push to main. Test discovery follows filesystem conventions
# at every depth, so new projects and suites need no workflow entries.
#
# Every node depends on generated code (its gitignored `.peppy/libs`) that only
# a running peppy daemon can produce, since `peppy node sync` calls the daemon's
# node_generate service and resolves contracts through the daemon's repository
# registry. So this job installs a peppy release, readies its bundled apptainer
# for unprivileged use, boots a daemon of its own, generates the tested nodes'
# interfaces, and runs each node's tests inside a container derived from its
# `apptainer.def`. The runner image provides none of the nodes' build
# dependencies. The runner is self-hosted and reused, so everything worth
# keeping between runs (test images, cargo registries, per-crate target dirs,
# uv's downloads) simply outlives the job in the cache directory named below.
#
# Every job runs on that self-hosted runner, except on a pull request from a
# fork: fork code must not run on a box that persists between jobs and holds
# every repository's build caches, so those runs go to a GitHub-hosted runner,
# which starts from a cold cache. `github.event.pull_request.head.repo.fork` is
# null on push, which the expression reads as false.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'self-hosted' }}
    # Use the newest Python minor required by repository projects. This is a
    # syntax gate; each project's tests still use its own Python requirements.
    container: python:3.13
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile every tracked Python file
        run: python .github/scripts/check-python-syntax.py

  javascript-typescript:
    name: JavaScript and TypeScript tests
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'self-hosted' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Discover and run Node test suites
        run: python3 .github/scripts/run-node-tests.py

  discover-and-run:
    name: All Rust and Python tests
    # The self-hosted runner is x86, and the cache directory named below
    # carries the architecture, so moving this repository onto an arm runner
    # starts from an empty cache rather than a wrong-arch one. The base images
    # and the librealsense apt repository are published for both.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || 'self-hosted' }}
    # A cold run compiles nine crates' full dependency trees and resolves
    # lerobot's, torch included. The persistent cache keeps warm runs far under
    # this, but a run that cannot reuse it (a fork's pull request, or the first
    # run after the directory is cleared) is legitimately slow.
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Nothing here pushes, so the job has no use for a writable
          # credential sitting in .git/config for every later step to inherit.
          persist-credentials: false

      # Container images, cargo registries, crate build outputs and uv's
      # download cache outlive the run in a directory on the self-hosted
      # runner: they are what makes a warm run cheap. Nothing mounts or
      # uploads it — the box is reused, so the directory the step below names
      # is simply still there. The directory is live rather than a snapshot,
      # so a run reads what the previous run left and a pull request writes
      # into what later runs build on; nothing stored here may therefore be
      # state one run depends on another having written, only caches
      # apptainer, cargo and uv can rebuild from scratch. The runner executes
      # one job at a time, so concurrent writers are not a concern today; a
      # second runner would make these directories shared mutable state and
      # is a reason to revisit this. A fork's pull request runs on a
      # GitHub-hosted runner and so neither reads nor writes the cache.
      - name: Name the caches this run reuses
        run: python3 .github/scripts/configure-build-cache.py

      - name: Discover all Rust and Python tests
        id: discover
        run: python3 .github/scripts/discover-tests.py

      - name: Install peppy
        if: steps.discover.outputs.any == 'true'
        env:
          PEPPY_VERSION: ${{ vars.PEPPY_VERSION }}
        run: python3 .github/scripts/install-peppy.py

      - name: Ready the bundled apptainer for unprivileged use
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/setup-apptainer.py

      - name: Start an isolated peppy daemon
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/start-peppy-daemon.py

      - name: Generate the tested nodes' interface code
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/sync-test-nodes.py

      - name: Prove the committed lockfiles resolve against the generated interfaces
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/check-lockfiles.py

      - name: Run all Rust tests in their build containers
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/run-rust-tests.py

      - name: Run all Python tests in their build containers
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/run-python-tests.py

      - name: Prove CI tested the committed manifests and lockfiles
        run: python3 .github/scripts/check-tested-manifests.py
