name: Tests

# Runs this repository's Rust, Python, JavaScript and TypeScript tests on each
# pull request and push to main. Test discovery follows filesystem conventions
# at every depth, so new projects and suites need no workflow entries.
#
# A push to main runs every suite. A pull request runs the suites of the
# projects it touches, and anything it changes that no project holds (this
# file, the scripts it runs, anything at the root) puts every project back in
# scope. Every project a run leaves out is named in its summary, so a scoped
# run never reads as full coverage.
#
# Every node depends on generated code (its gitignored `.peppy/libs`) that only
# a running peppy daemon can produce, since `peppy node sync` calls the daemon's
# node_generate service and resolves contracts through the daemon's repository
# registry. So this job installs a peppy release, readies its bundled apptainer
# for unprivileged use, boots a daemon of its own, generates the tested nodes'
# interfaces, and runs each node's tests inside a container derived from its
# `apptainer.def`. The runner image provides none of the nodes' build
# dependencies. The runner is self-hosted and reused, so everything worth
# keeping between runs (test images, cargo registries, per-crate target dirs,
# uv's downloads) simply outlives the job in the cache directory named below.
#
# Every job runs on that self-hosted runner; no job uses a GitHub-hosted one.
# A pull request from a fork lands there too, so what keeps fork code off the
# box is the repository's fork-PR approval gate, not the runner it is
# scheduled on.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  python-syntax:
    name: Python syntax
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Use the newest Python minor required by repository projects. This is a
      # syntax gate; each project's tests still use its own Python
      # requirements.
      #
      # Through setup-python rather than the `container: python:3.13` this job
      # used to declare. A container job has the runner pull the image with
      # docker, and docker is not installed on every self-hosted box — this job
      # failed with `docker: command not found` before reaching a single step
      # of its own. setup-python wants nothing but the runner's tool cache, so
      # it works the same on every box, and it drops a Docker Hub pull from
      # every run, which matters because the anonymous pull quota those boxes
      # share is the tightest thing about them. It is what the other
      # repositories here already reach for.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Compile every tracked Python file
        run: python .github/scripts/check-python-syntax.py

  javascript-typescript:
    name: JavaScript and TypeScript tests
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Discover and run Node test suites
        run: python3 .github/scripts/run-node-tests.py

  discover-and-run:
    name: All Rust and Python tests
    # The self-hosted runner is x86, and the cache directory named below
    # carries the architecture, so moving this repository onto an arm runner
    # starts from an empty cache rather than a wrong-arch one. The base images
    # and the librealsense apt repository are published for both.
    runs-on: self-hosted
    # A cold run compiles nine crates' full dependency trees and resolves
    # lerobot's, torch included. The persistent cache keeps warm runs far under
    # this, but the first run after the directory is cleared is legitimately
    # slow.
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history: discovery diffs a pull request against its base to
          # decide which projects' suites to run, and a shallow checkout holds
          # neither the base commit nor the merge base with it.
          fetch-depth: 0
          # Nothing here pushes, so the job has no use for a writable
          # credential sitting in .git/config for every later step to inherit.
          persist-credentials: false

      # Container images, cargo registries, crate build outputs and uv's
      # download cache outlive the run in a directory on the self-hosted
      # runner: they are what makes a warm run cheap. Nothing mounts or
      # uploads it — the box is reused, so the directory the step below names
      # is simply still there. The directory is live rather than a snapshot,
      # so a run reads what the previous run left and a pull request writes
      # into what later runs build on; nothing stored here may therefore be
      # state one run depends on another having written, only caches
      # apptainer, cargo and uv can rebuild from scratch. Each self-hosted
      # runner is its own machine with its own $HOME, so this directory is
      # per-box rather than shared: every box pays its own cold start, and
      # whether a run is warm depends on which one it lands on. A box runs one
      # job at a time, so nothing races inside these directories; two runner
      # agents on a single box would, and is the thing to revisit.
      - name: Name the caches this run reuses
        run: python3 .github/scripts/configure-build-cache.py

      # Every node image bootstraps from a public `peppybot/*` base on Docker
      # Hub, and an anonymous pull is charged against a quota tied to the
      # address it comes from. On Blacksmith each job pulled from its own
      # short-lived address, so the quota was never close. The self-hosted
      # boxes are few and every repository's jobs share their addresses, so a
      # run that has to build images the cache does not hold yet exhausts it
      # partway through — and Docker Hub reports the overage by refusing a
      # token with `unauthorized: incorrect username or password`, which reads
      # like a credential fault but is a quota. Authenticating raises the
      # ceiling and charges it to the account instead of the box.
      #
      # Apptainer reads these two variables for every `docker://` bootstrap,
      # the pulls the daemon makes on its own included. They are exported only
      # when both secrets carry a value: a pull request from a fork is given
      # no secrets, and an empty username would have apptainer send empty
      # credentials and be refused outright, which is worse than the anonymous
      # pull it would otherwise have made.
      - name: Authenticate the base image pulls against Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_USERNAME:-}" ] && [ -n "${DOCKER_TOKEN:-}" ]; then
            {
              echo "APPTAINER_DOCKER_USERNAME=$DOCKER_USERNAME"
              echo "APPTAINER_DOCKER_PASSWORD=$DOCKER_TOKEN"
            } >> "$GITHUB_ENV"
            echo "Base image pulls authenticate as $DOCKER_USERNAME."
          else
            echo "No Docker Hub credentials in scope; pulls stay anonymous and share the box's quota."
          fi

      # Discovery decides what the rest of this job runs, so its own suite runs
      # first: a selection bug is the one kind that goes unnoticed, because it
      # reports success over the suites it never selected.
      - name: Run the discovery script's own tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Discover the tests this change reaches
        id: discover
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/discover-tests.py

      - name: Install peppy
        if: steps.discover.outputs.any == 'true'
        env:
          PEPPY_VERSION: ${{ vars.PEPPY_VERSION }}
        run: python3 .github/scripts/install-peppy.py

      - name: Ready the bundled apptainer for unprivileged use
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/setup-apptainer.py

      - name: Start an isolated peppy daemon
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/start-peppy-daemon.py

      - name: Generate the tested nodes' interface code
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/sync-test-nodes.py

      - name: Prove the committed lockfiles resolve against the generated interfaces
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/check-lockfiles.py

      - name: Run the selected Rust tests in their build containers
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/run-rust-tests.py

      - name: Run the selected Python tests in their build containers
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/run-python-tests.py

      - name: Prove CI tested the committed manifests and lockfiles
        run: python3 .github/scripts/check-tested-manifests.py
