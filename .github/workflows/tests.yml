name: Tests

# Runs this repository's Rust, Python, JavaScript and TypeScript tests on each
# pull request and push to main. Test discovery follows filesystem conventions
# at every depth, so new projects and suites need no workflow entries.
#
# A push to main runs every suite. A pull request runs the suites of the
# projects it touches, and anything it changes that no project holds (this
# file, the scripts it runs, anything at the root) puts every project back in
# scope. Every project a run leaves out is named in its summary, so a scoped
# run never reads as full coverage.
#
# Every node depends on generated code (its gitignored `.peppy/libs`) that only
# a running peppy daemon can produce, since `peppy node sync` calls the daemon's
# node_generate service and resolves contracts through the daemon's repository
# registry. So this job installs a peppy release, readies its bundled apptainer
# for unprivileged use, boots a daemon of its own, generates the tested nodes'
# interfaces, and runs each node's tests inside a container derived from its
# `apptainer.def`. The runner image provides none of the nodes' build
# dependencies.
#
# Every job runs on a RunsOn runner: an EC2 instance of its own, booted from
# the peppy-ubuntu24 image for the job and discarded after it, sized by the
# job's runs-on label. Everything worth keeping between runs (test images,
# cargo registries, per-crate target dirs, uv's downloads) lives on the test
# job's sticky disk, which RunsOn snapshots after the job and restores for the
# next run on the same branch, or from main's newest snapshot for a branch's
# first run. A pull request's run reads main's snapshot but never writes it;
# the push to main is what keeps it current. A pull request from a fork runs
# on the same runners, so what holds fork code is the repository's fork-PR
# approval gate.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  python-syntax:
    name: Python syntax
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=2/ram=4+8  # custom Peppy AMI
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Use the newest Python minor required by repository projects. This is a
      # syntax gate; each project's tests still use its own Python
      # requirements.
      #
      # Through setup-python rather than a `container: python:3.13` job:
      # setup-python wants nothing but the runner's tool cache, and it spares
      # every run a Docker Hub pull. It is what the other repositories here
      # already reach for.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Compile every tracked Python file
        run: python .github/scripts/check-python-syntax.py

  javascript-typescript:
    name: JavaScript and TypeScript tests
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=2/ram=4+8  # custom Peppy AMI
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Discover and run Node test suites
        run: python3 .github/scripts/run-node-tests.py

  discover-and-run:
    name: All Rust and Python tests
    # 16 vCPU with 2 GB each for the containerized cargo builds and lerobot's
    # resolution (a full run peaks near 5 GB), on the current AMD and Intel
    # compute-optimized families, a root disk with room for the run's uv
    # environments, and the sticky disk that holds the caches named below
    # (a cold full run fills about 77 GB of it). RunsOn keeps a sticky disk per
    # architecture, so moving this job onto an arm runner starts from an empty
    # cache rather than a wrong-arch one. The base images and the librealsense
    # apt repository are published for both.
    runs-on: runs-on=${{ github.run_id }}/runner=peppy-ci-ubuntu-24.04-x86_64/image=peppy-ubuntu24/cpu=16/ram=32/family=c7a+c7i+c8a+c8i/volume=150gb:gp3:500mbs:6000iops/sticky=node-tests:200gb  # custom Peppy AMI
    # A cold run compiles nine crates' full dependency trees and resolves
    # lerobot's, torch included. The sticky disk keeps warm runs far under
    # this, but a run that starts from an empty disk is legitimately slow.
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history: discovery diffs a pull request against its base to
          # decide which projects' suites to run, and a shallow checkout holds
          # neither the base commit nor the merge base with it.
          fetch-depth: 0
          # Nothing here pushes, so the job has no use for a writable
          # credential sitting in .git/config for every later step to inherit.
          persist-credentials: false

      # Container images, cargo registries, crate build outputs and uv's
      # download cache live on the job's sticky disk: they are what makes a
      # warm run cheap. runs-on/action bind-mounts the directory the next step
      # names onto the disk, which RunsOn restored before the job and
      # snapshots after it. Nothing stored here may be state one run depends
      # on another having written, only caches apptainer, cargo and uv can
      # rebuild from scratch.
      - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2.3.1
        with:
          sticky_cache: custom,path=~/.cache/nodes-hub-ci

      - name: Name the caches this run reuses
        run: python3 .github/scripts/configure-build-cache.py

      # Every node image bootstraps from a public `peppybot/*` base on Docker
      # Hub, and an anonymous pull is charged against a quota tied to the
      # address it comes from, which a run that has to build images the cache
      # does not hold yet can exhaust partway through. Docker Hub reports the
      # overage by refusing a token with `unauthorized: incorrect username or
      # password`, which reads like a credential fault but is a quota.
      # Authenticating raises the ceiling and charges it to the account
      # instead of the address.
      #
      # Apptainer reads these two variables for every `docker://` bootstrap,
      # the pulls the daemon makes on its own included. They are exported only
      # when both secrets carry a value: a pull request from a fork is given
      # no secrets, and an empty username would have apptainer send empty
      # credentials and be refused outright, which is worse than the anonymous
      # pull it would otherwise have made.
      - name: Authenticate the base image pulls against Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKER_USERNAME:-}" ] && [ -n "${DOCKER_TOKEN:-}" ]; then
            {
              echo "APPTAINER_DOCKER_USERNAME=$DOCKER_USERNAME"
              echo "APPTAINER_DOCKER_PASSWORD=$DOCKER_TOKEN"
            } >> "$GITHUB_ENV"
            echo "Base image pulls authenticate as $DOCKER_USERNAME."
          else
            echo "No Docker Hub credentials in scope; pulls stay anonymous and count against this runner's address."
          fi

      # Discovery decides what the rest of this job runs, so its own suite runs
      # first: a selection bug is the one kind that goes unnoticed, because it
      # reports success over the suites it never selected.
      - name: Run the discovery script's own tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Discover the tests this change reaches
        id: discover
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/discover-tests.py

      - name: Install peppy
        if: steps.discover.outputs.any == 'true'
        env:
          PEPPY_VERSION: ${{ vars.PEPPY_VERSION }}
        run: python3 .github/scripts/install-peppy.py

      - name: Ready the bundled apptainer for unprivileged use
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/setup-apptainer.py

      - name: Start an isolated peppy daemon
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/start-peppy-daemon.py

      - name: Generate the tested nodes' interface code
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/sync-test-nodes.py

      - name: Prove the committed lockfiles resolve against the generated interfaces
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/check-lockfiles.py

      - name: Run the selected Rust tests in their build containers
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/run-rust-tests.py

      - name: Run the selected Python tests in their build containers
        if: steps.discover.outputs.any == 'true'
        run: python3 .github/scripts/run-python-tests.py

      - name: Prove CI tested the committed manifests and lockfiles
        run: python3 .github/scripts/check-tested-manifests.py
