[package]
name = "uvc_camera_linux"
version = "0.1.0"
edition = "2024"

[dependencies]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0"
nokhwa = { version = "0.10", features = ["input-native"] }
image = "0.25"
v4l2-sys-mit = "0.3.0"
libc = "0.2"
