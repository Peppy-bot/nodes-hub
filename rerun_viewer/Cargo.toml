[package]
name = "rerun_viewer"
version = "0.1.0"
edition = "2024"
description = "Draws a robot stack's camera, arms and planning scene, live, in the Rerun web viewer"

[lints.rust]
unsafe_code = "deny"

[dependencies]
camera_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "camera_core" }
chain_kinematics = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "chain_kinematics" }
control_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "control_core" }
# No default features: they hold `analytics`, which sends usage data to Rerun.
rerun = { version = "=0.41.0", default-features = false, features = ["sdk", "server", "web_viewer", "image"] }
robot_description = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "robot_description" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }

[dev-dependencies]
peppygen = { path = ".peppy/libs/peppygen", features = ["testing"] }
# The collision meshes of the bundled robot models, for a test on a real robot.
robot_description = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "robot_description", features = ["meshes"] }
