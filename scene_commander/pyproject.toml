[project]
name = "scene-commander"
version = "0.1.0"
description = "Peppy web scene commander for simulations with scene control"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "pycapnp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scene_commander"]
