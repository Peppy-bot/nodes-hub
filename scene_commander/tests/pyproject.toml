# This GPU-free test project drives the commander's HTTP API against a fake
# scene provider, without a daemon or generated peppygen interfaces.
[project]
name = "scene-commander-tests"
version = "0.1.0"
description = "Tests for the scene commander HTTP API and its Peppy calls"
requires-python = ">=3.11,<3.12"
dependencies = [
    # What the API is built on; the node pins no version either.
    "aiohttp",
    # What the endpoint tests read the node's peppy.json5 with, so the runner
    # they announce on refuses a label the manifest does not declare.
    "pyjson5==2.0.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The commander's own modules, imported from the source tree.
pythonpath = ["../src"]
