[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reactive_policy"
version = "0.1.0"
description = "reactive_policy peppy node"
requires-python = ">=3.11,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
reactive_policy = "reactive_policy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reactive_policy"]

[dependency-groups]
dev = []

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
