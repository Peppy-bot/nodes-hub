[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cam_consumer"
version = "0.1.0"
description = "cam_consumer peppy node"
requires-python = ">=3.11,<3.14"
dependencies = ["peppygen", "peppylib"]

[project.scripts]
cam_consumer = "cam_consumer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cam_consumer"]

[dependency-groups]
dev = []

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
