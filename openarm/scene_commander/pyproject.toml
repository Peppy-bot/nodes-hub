[project]
name = "openarm-scene-commander"
version = "0.1.0"
description = "Peppy web scene commander for OpenArm Isaac Sim"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "pycapnp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openarm_scene_commander"]
