[project]
name = "openarm-scene-commander"
version = "0.1.0"
description = "Peppy web scene commander for OpenArm simulation engines"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "pycapnp",
    "peppygen",
    "peppylib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openarm_scene_commander"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv.sources]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
