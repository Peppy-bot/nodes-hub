[package]
name = "openarm_ker"
version = "0.1.0"
edition = "2024"

[dependencies]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
control_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "control_core" }
# One revision per git source, so the explicit rev keeps this dependency's
# source apart from the crates above, which the lockfile holds at theirs.
instance_lock = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "instance_lock", rev = "30a609fdd207befca957db4222732e2cd46d6b21" }
openarm_description = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "openarm_description" }
rusb = "0.9"
serialport = "4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
peppygen = { path = ".peppy/libs/peppygen", features = ["testing"] }
tokio = { version = "1", features = ["test-util"] }
