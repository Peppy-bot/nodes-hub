[package]
name = "openarm_backbone"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
srs_model = { git = "https://github.com/Peppy-bot/public-peppy-libs", branch = "chore/dependency-upgrades", package = "srs_model" }
bimanual_collision_model = { git = "https://github.com/Peppy-bot/public-peppy-libs", branch = "chore/dependency-upgrades", package = "bimanual_collision_model" }
openarm_description = { git = "https://github.com/Peppy-bot/public-peppy-libs", branch = "chore/dependency-upgrades", package = "openarm_description", features = ["meshes"] }
control_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", branch = "chore/dependency-upgrades", package = "control_core" }
workspace_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", branch = "chore/dependency-upgrades", package = "workspace_core" }
# The camera mounts are placed against the bundled URDF's fixed joints. The
# version public-peppy-libs uses: the mounts hand the parsed robot to
# `srs_model::chain_kinematics::Tree::from_robot`, which takes that version's
# `urdf_rs::Robot`.
urdf-rs = "0.10"

# The collision narrowphase (GJK/EPA over convex hulls) and forward kinematics
# are dense nalgebra f64 kernels. At the dev profile's opt-level 0 the governor's
# simulation-loop tests, which fire thousands of distance queries, run ~100x
# slower (~100s vs <1s). Optimizing only these geometry crates keeps this crate
# itself unoptimized and debuggable while making the tests usable.
[profile.dev.package.bimanual_collision_model]
opt-level = 3

[profile.dev.package.srs_model]
opt-level = 3

[profile.dev.package.chain_kinematics]
opt-level = 3

[profile.dev.package.nalgebra]
opt-level = 3

[dev-dependencies]
peppygen = { path = ".peppy/libs/peppygen", features = ["testing"] }
# A paused clock, so a test waits out the service loop's pause without the
# host's time.
tokio = { version = "1", features = ["full", "test-util"] }
