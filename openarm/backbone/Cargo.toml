[package]
name = "openarm_backbone"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
srs_model = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "srs_model" }
self_collision_model = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "self_collision_model" }
robot_description = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "robot_description", features = ["meshes"] }
control_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "control_core" }
camera_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "camera_core" }
workspace_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "workspace_core", features = ["description"] }

# The collision narrowphase (GJK/EPA over convex hulls) and forward kinematics
# are dense nalgebra f64 kernels. At the dev profile's opt-level 0 the governor's
# simulation-loop tests, which fire thousands of distance queries, run ~100x
# slower (~100s vs <1s). Optimizing only these geometry crates keeps this crate
# itself unoptimized and debuggable while making the tests usable.
[profile.dev.package.self_collision_model]
opt-level = 3

[profile.dev.package.collision_geometry]
opt-level = 3

[profile.dev.package.srs_model]
opt-level = 3

[profile.dev.package.chain_kinematics]
opt-level = 3

[profile.dev.package.nalgebra]
opt-level = 3

[dev-dependencies]
hegeltest = { version = "0.51", features = ["static-engine"] }
peppygen = { path = ".peppy/libs/peppygen", features = ["testing"] }
