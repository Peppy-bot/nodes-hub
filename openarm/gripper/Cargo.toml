[package]
name = "openarm_gripper"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
openarm_can = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "openarm_can" }
control_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "control_core" }
instance_lock = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "instance_lock" }
robot_description = { git = "https://github.com/Peppy-bot/public-peppy-libs", package = "robot_description" }
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }

[dev-dependencies]
peppygen = { path = ".peppy/libs/peppygen", features = ["testing"] }
