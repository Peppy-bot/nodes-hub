[package]
name = "openarm_arm_sim"
version = "0.1.0"
edition = "2024"

[dependencies]
control_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", branch = "main", package = "control_core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }

[[bin]]
name = "openarm_arm_sim"
path = "src/main.rs"

[dev-dependencies]
peppygen = { path = ".peppy/libs/peppygen", features = ["testing"] }
