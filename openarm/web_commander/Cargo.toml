[package]
name = "openarm_web_commander"
version = "0.1.0"
edition = "2024"

[dependencies]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
openarm_description = { git = "https://github.com/Peppy-bot/public-peppy-libs", rev = "960ed472252acbb5766a1e604b337d511d31700b", package = "openarm_description" }
srs_model = { git = "https://github.com/Peppy-bot/public-peppy-libs", rev = "960ed472252acbb5766a1e604b337d511d31700b", package = "srs_model" }
control_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", rev = "960ed472252acbb5766a1e604b337d511d31700b", package = "control_core" }
urdf-rs = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"

[dev-dependencies]
peppygen = { path = ".peppy/libs/peppygen", features = ["testing"] }
