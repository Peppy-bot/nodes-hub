[package]
name = "openarm_web_commander"
version = "0.1.0"
edition = "2024"

[dependencies]
peppygen = { path = ".peppy/libs/peppygen" }
peppylib = { path = ".peppy/libs/peppylib" }
openarm_description = { git = "https://github.com/Peppy-bot/public-peppy-libs", branch = "chore/dependency-upgrades", package = "openarm_description" }
srs_model = { git = "https://github.com/Peppy-bot/public-peppy-libs", branch = "chore/dependency-upgrades", package = "srs_model" }
control_core = { git = "https://github.com/Peppy-bot/public-peppy-libs", branch = "chore/dependency-upgrades", package = "control_core" }
# The version public-peppy-libs uses, so the velocity limits come from the
# same parser as the backbone's, and one urdf-rs is built.
urdf-rs = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"

[dev-dependencies]
peppygen = { path = ".peppy/libs/peppygen", features = ["testing"] }
